name: Windows release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Windows executable
    runs-on: windows-latest
    env:
      CGO_ENABLED: '1'
      GOOS: windows
      GOARCH: amd64

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # go-fltk links against the MinGW libraries bundled with the pinned
      # dependency. MSYS2 supplies gcc, g++, and windres on the hosted runner.
      - name: Install MinGW toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake

      # go-fltk ships prebuilt Windows archives, but those archives were built
      # with an older MinGW CRT and cannot be linked by current GCC releases
      # (_setjmp is the first incompatible symbol). Rebuilding them here keeps
      # FLTK and the final executable on exactly the same compiler and CRT.
      - name: Rebuild FLTK for the runner toolchain
        shell: msys2 {0}
        run: |
          fltk_dir="$(go list -m -f '{{.Dir}}' github.com/pwiecz/go-fltk)"
          fltk_dir="$(cygpath -u "$fltk_dir")"
          chmod -R u+w "$fltk_dir"
          cd "$fltk_dir"
          go generate

      - name: Verify tag and toolchain
        shell: msys2 {0}
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use semantic version form v1.2.3 (got '$GITHUB_REF_NAME')." >&2
            exit 1
          fi
          go version
          gcc --version | head -n 1
          g++ --version | head -n 1
          windres --version | head -n 1
          cmake --version | head -n 1

      - name: Run tests
        shell: msys2 {0}
        run: |
          go test -count=1 ./...
          go vet ./...

      - name: Build release executable
        shell: msys2 {0}
        run: |
          mkdir -p bin
          windres --target=pe-x86-64 --input-format=rc --output-format=coff \
            -i assets/foldersnap.rc -o cmd/foldersnap/foldersnap_windows_amd64.syso
          go build -trimpath -o bin/FolderSnap.exe \
            -ldflags='-H=windowsgui -s -w -linkmode external -extldflags "-static -static-libgcc -static-libstdc++"' \
            ./cmd/foldersnap
          test -f bin/FolderSnap.exe
          sha256sum bin/FolderSnap.exe | sed 's#bin/##' > bin/FolderSnap.sha256

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: FolderSnap ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            bin/FolderSnap.exe
            bin/FolderSnap.sha256
